server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: a-stock-advisor-agent
  datasource:
    url: ${POSTGRES_URL:jdbc:h2:mem:a_stock_advisor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${POSTGRES_USER:sa}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: ${POSTGRES_DRIVER:org.h2.Driver}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

advisor:
  llm:
    enabled: ${ADVISOR_LLM_ENABLED:false}
    base-url: ${ADVISOR_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${ADVISOR_LLM_API_KEY:}
    model-name: ${ADVISOR_LLM_MODEL:qwen-plus}
    temperature: ${ADVISOR_LLM_TEMPERATURE:0.2}
    timeout: ${ADVISOR_LLM_TIMEOUT:60s}

app:
  cache:
    redis:
      enabled: ${APP_CACHE_REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
    ttl:
      quote: ${APP_CACHE_TTL_QUOTE:15s}
      kline: ${APP_CACHE_TTL_KLINE:1h}
      finance: ${APP_CACHE_TTL_FINANCE:1d}
      news: ${APP_CACHE_TTL_NEWS:30m}
      report: ${APP_CACHE_TTL_REPORT:10m}
