<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Stock Advisor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <header class="topbar">

          <p class="eyebrow">A Stock Advisor Agent</p>

      <form id="advisor-form" class="query-panel">
        <label for="query">鍒嗘瀽璇锋眰</label>
        <div class="query-row">
          <input id="query" name="query" type="text" value="Analyze 600519" autocomplete="off">
          <select id="analysisType" name="analysisType">
            <option value="full">瀹屾暣鍒嗘瀽</option>
            <option value="valuation">浼板€煎垎鏋?/option>
            <option value="risk">椋庨櫓鍒嗘瀽</option>
          </select>
          <button type="submit">寮傛鐢熸垚</button>
        </div>
      </form>

      <section id="task-card" class="task-card" hidden>
        <div>
          <p class="eyebrow">Async Task</p>
          <strong id="task-status">绛夊緟鎻愪氦</strong>
        </div>
        <div class="task-meta">
          <span id="task-id" class="tag">-</span>
          <span id="task-report-id" class="tag">report -</span>
        </div>
      </section>

      <section id="report-panel" class="report-panel">
        <div class="empty-state">鐢熸垚鎴栭€夋嫨涓€浠藉巻鍙叉姤鍛婂悗锛岃繖閲屼細灞曠ず璐ㄩ噺璇勫垎銆佹礊瀵熷拰璇佹嵁閾俱€?/div>
      </section>
    </section>

    <aside class="history-panel">
      <h2>鍘嗗彶鎶ュ憡</h2>
      <form id="history-form" class="history-form">
        <input id="history-stock-code" type="text" value="600519" aria-label="鑲＄エ浠ｇ爜">
        <button type="submit">鏌ヨ</button>
      </form>
      <div id="history-list" class="history-list"></div>
    </aside>
  </main>

  <template id="report-template">
    <article class="report-card">
      <header class="report-header">
        <div>
          <p class="eyebrow stock-code"></p>
          <h2 class="stock-name"></h2>
        </div>
        <div id="quality-card" class="quality-card"></div>
      </header>

      <section class="section">
        <h3>鏍稿績缁撹</h3>
        <p class="conclusion"></p>
      </section>

      <section class="section">
        <h3>璐ㄩ噺鎻愮ず</h3>
        <div class="quality-detail"></div>
      </section>

      <section class="section">
        <h3>鍙В閲婃礊瀵?/h3>
        <div id="insight-list" class="insight-list"></div>
      </section>

      <section class="section">
        <h3>璇佹嵁閾?/h3>
        <div id="evidence-list" class="evidence-list"></div>
      </section>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
