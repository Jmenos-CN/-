<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Stock Advisor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">A Stock Advisor Agent</p>
          <h1>研报分析工作台</h1>
        </div>
        <div id="status" class="status">就绪</div>
      </header>

      <form id="advisor-form" class="query-panel">
        <label for="query">分析请求</label>
        <div class="query-row">
          <input id="query" name="query" type="text" value="Analyze 600519" autocomplete="off">
          <select id="analysisType" name="analysisType">
            <option value="full">完整分析</option>
            <option value="valuation">估值分析</option>
            <option value="risk">风险分析</option>
          </select>
          <button type="submit">生成报告</button>
        </div>
      </form>

      <section id="report-panel" class="report-panel">
        <div class="empty-state">生成或选择一份历史报告后，这里会展示质量评分、洞察和证据链。</div>
      </section>
    </section>

    <aside class="history-panel">
      <h2>历史报告</h2>
      <form id="history-form" class="history-form">
        <input id="history-stock-code" type="text" value="600519" aria-label="股票代码">
        <button type="submit">查询</button>
      </form>
      <div id="history-list" class="history-list"></div>
    </aside>
  </main>

  <template id="report-template">
    <article class="report-card">
      <header class="report-header">
        <div>
          <p class="eyebrow stock-code"></p>
          <h2 class="stock-name"></h2>
        </div>
        <div id="quality-card" class="quality-card"></div>
      </header>

      <section class="section">
        <h3>核心结论</h3>
        <p class="conclusion"></p>
      </section>

      <section class="section">
        <h3>质量提示</h3>
        <div class="quality-detail"></div>
      </section>

      <section class="section">
        <h3>可解释洞察</h3>
        <div id="insight-list" class="insight-list"></div>
      </section>

      <section class="section">
        <h3>证据链</h3>
        <div id="evidence-list" class="evidence-list"></div>
      </section>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
